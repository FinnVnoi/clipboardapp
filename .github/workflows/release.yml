name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B "$env:RUNNER_TEMP\clipboardapp-build" -G "Visual Studio 17 2022" -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build Release
        shell: pwsh
        run: cmake --build "$env:RUNNER_TEMP\clipboardapp-build" --config Release --parallel

      - name: Package release
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP\clipboardapp-release"
          $executable = "$env:RUNNER_TEMP\clipboardapp-build\Release\ClipboardTxtApp.exe"
          $archive = "ClipboardTxtApp-$env:GITHUB_REF_NAME-windows-x64.zip"

          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -Path $executable -Destination $stage
          Copy-Item -Path README.md, LICENSE -Destination $stage
          Compress-Archive -Path "$stage\*" -DestinationPath $archive -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $archive = "ClipboardTxtApp-$env:GITHUB_REF_NAME-windows-x64.zip"
          gh release create $env:GITHUB_REF_NAME $archive `
            --repo $env:GITHUB_REPOSITORY `
            --title "ClipboardTxtApp $env:GITHUB_REF_NAME" `
            --generate-notes `
            --verify-tag
