name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B "$env:RUNNER_TEMP\clipboardapp-build" -G "Visual Studio 17 2022" -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build Release
        shell: pwsh
        run: cmake --build "$env:RUNNER_TEMP\clipboardapp-build" --config Release --parallel

      - name: Verify executable
        shell: pwsh
        run: |
          $executable = "$env:RUNNER_TEMP\clipboardapp-build\Release\ClipboardTxtApp.exe"
          if (-not (Test-Path $executable)) {
            throw "Build output was not found: $executable"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardTxtApp-windows-x64
          path: ${{ runner.temp }}/clipboardapp-build/Release/ClipboardTxtApp.exe
          if-no-files-found: error
